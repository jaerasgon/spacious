[package]
name = "spacious"
version = "2.0.0"
edition = "2024"
description = "See what's taking up your disk: a live treemap for macOS"
license = "MIT"
repository = "https://github.com/jaerasgon/spacious"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.36"
rayon = "1.10"
rfd = "0.17"
libc = "0.2"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
